name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Build the binary and the AppImage
        run: ./scripts/build-appimage.sh

      - name: Build the wheel and the sdist
        run: uv build --out-dir dist-python

      - name: Smoke test the AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          ./dist/iroha-reader-cli-x86_64.AppImage --appimage-extract-and-run \
            examples/sample_en.txt -o /tmp/out
          test -s /tmp/out/sample_en.mp3

      - uses: actions/upload-artifact@v7
        with:
          name: iroha-reader-cli-${{ github.ref_name }}
          path: |
            dist/iroha-reader-cli
            dist/iroha-reader-cli-x86_64.AppImage
            dist-python/*

      - name: Notes for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v want="## [$tag]" '
            index($0, want) == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
          cat release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/iroha-reader-cli dist/iroha-reader-cli-x86_64.AppImage dist-python/*)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
