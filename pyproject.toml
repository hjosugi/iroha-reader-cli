[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iroha-reader-cli"
dynamic = ["version"]
description = "Read documents out loud: md / epub / pdf / txt to audio plus synced LRC / SRT / VTT subtitles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hjosugi", email = "h.jo.sugi@gmail.com" }]
keywords = ["tts", "lrc", "subtitles", "audiobook", "markdown", "pdf", "japanese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing",
]
dependencies = [
  "edge-tts>=7.2",
  "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/hjosugi/iroha-reader-cli"
Repository = "https://github.com/hjosugi/iroha-reader-cli"
Issues = "https://github.com/hjosugi/iroha-reader-cli/issues"
Changelog = "https://github.com/hjosugi/iroha-reader-cli/blob/main/CHANGELOG.md"

[project.scripts]
iroha-reader-cli = "iroha_reader_cli.cli:main"
# Short alias, for the many times a day you type it.
irh = "iroha_reader_cli.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# Only needed for the single-file and AppImage builds.
build = ["pyinstaller>=6.0"]

[tool.hatch.version]
path = "src/iroha_reader_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iroha_reader_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",
  "F",    # pyflakes
  "I",    # import order
  "N",    # naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "PIE",
  "RET",
  "PTH",  # pathlib over os.path
  "ARG",  # unused arguments
  "RUF",
]
ignore = [
  "RET504",  # a named result before return often reads better
  "SIM108",  # ternaries are not always clearer
]
# This tool reads Japanese, so full width punctuation is the point, not a typo.
allowed-confusables = ["。", "．", "！", "？", "、", "：", "）", "”", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[[tool.mypy.overrides]]
module = ["edge_tts.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs ffmpeg and espeak-ng, runs a real conversion",
]

[tool.coverage.run]
source = ["iroha_reader_cli"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
