name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install the audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng poppler-utils

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run the tests
        run: uv run --no-sync pytest -v

  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/audio-tools
        with:
          espeak-on-path: "true"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --python 3.13

      - name: Run the tests
        run: uv run --no-sync pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: ruff
        run: uv run --no-sync ruff check --output-format github .

      - name: mypy
        run: uv run --no-sync mypy

  build:
    name: build the single file binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build
        shell: bash
        run: ./scripts/build-native.sh

      # On Windows espeak-ng stays off PATH, as its installer leaves it,
      # so this also proves the binary finds it on its own.
      - uses: ./.github/actions/audio-tools

      - name: It reads a document and serves the reading room
        shell: bash
        run: ./scripts/smoke-test.sh dist/iroha-reader-cli

  nuitka:
    name: build with Nuitka and compare
    runs-on: ubuntu-latest
    # The same old-glibc container the released binaries are built in.
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      UV_PYTHON: /opt/python/cp313-cp313/bin/python3
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # manylinux ships its Pythons without a shared libpython; Nuitka links
      # the static one, which the image keeps packed away for this purpose.
      - name: Unpack the static libpython
        run: cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz

      - name: Build both
        run: |
          ./scripts/build-nuitka.sh
          ./scripts/build-native.sh

      - uses: actions/upload-artifact@v7
        with:
          name: nuitka-and-pyinstaller
          path: |
            dist/iroha-reader-cli
            dist/iroha-reader-cli-nuitka
          if-no-files-found: error

  nuitka-compare:
    name: run and measure the Nuitka build
    needs: nuitka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nuitka-and-pyinstaller
          path: dist

      - uses: ./.github/actions/audio-tools

      - name: It reads a document and serves the reading room
        run: |
          chmod +x dist/*
          ./scripts/smoke-test.sh dist/iroha-reader-cli-nuitka

      - name: Size and start-up time against PyInstaller
        run: ./scripts/compare-builds.sh dist/iroha-reader-cli dist/iroha-reader-cli-nuitka | tee -a "$GITHUB_STEP_SUMMARY"
