name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }} binary
    runs-on: ${{ matrix.runner }}
    # Built against an old glibc so the binaries run on old distributions
    # too. The glibc of the build machine is the floor.
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the binary and the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          # The manylinux image ships a static Python; PyInstaller needs a
          # shared libpython, which uv's own builds have.
          UV_PYTHON_PREFERENCE: only-managed
        run: ./scripts/build-appimage.sh

      - name: Report the glibc floor
        run: |
          objdump -T dist/iroha-reader-cli \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

      - name: Name the binary after its architecture
        run: mv dist/iroha-reader-cli dist/iroha-reader-cli-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            dist/iroha-reader-cli-linux-${{ matrix.arch }}
            dist/iroha-reader-cli-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  smoke:
    name: ${{ matrix.arch }} smoke test
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.arch }}
          path: dist

      - name: Read a document with both of them
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          chmod +x dist/*
          ./dist/iroha-reader-cli-linux-${{ matrix.arch }} \
            examples/sample_en.txt -o /tmp/plain --subs lrc,srt
          test -s /tmp/plain/sample_en.mp3
          test -s /tmp/plain/sample_en.srt
          ./dist/iroha-reader-cli-${{ matrix.arch }}.AppImage \
            --appimage-extract-and-run examples/sample_en.txt -o /tmp/appimage
          test -s /tmp/appimage/sample_en.mp3
          cat /tmp/plain/sample_en.lrc

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the wheel and the sdist
        run: uv build --out-dir dist-python

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Notes for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v want="## [$tag]" '
            index($0, want) == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
          ls -l dist dist-python
          cat release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/* dist-python/*)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
