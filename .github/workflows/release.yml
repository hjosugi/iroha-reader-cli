name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }} binary
    runs-on: ${{ matrix.runner }}
    # Built against an old glibc so the binaries run on old distributions
    # too. The glibc of the build machine is the floor.
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the binary and the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          # The manylinux image ships a static Python; PyInstaller needs a
          # shared libpython, which uv's own builds have.
          UV_PYTHON_PREFERENCE: only-managed
        run: ./scripts/build-appimage.sh

      - name: Report the glibc floor
        run: |
          objdump -T dist/iroha-reader-cli \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

      - name: Name the binary after its architecture
        run: mv dist/iroha-reader-cli dist/iroha-reader-cli-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            dist/iroha-reader-cli-linux-${{ matrix.arch }}
            dist/iroha-reader-cli-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  smoke:
    name: ${{ matrix.arch }} smoke test
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.arch }}
          path: dist

      - uses: ./.github/actions/audio-tools

      - name: Read a document with both of them
        run: |
          chmod +x dist/*
          ./scripts/smoke-test.sh ./dist/iroha-reader-cli-linux-${{ matrix.arch }}
          ./dist/iroha-reader-cli-${{ matrix.arch }}.AppImage \
            --appimage-extract-and-run examples/sample_en.txt -o /tmp/appimage
          test -s /tmp/appimage/sample_en.mp3

  other-platforms:
    name: ${{ matrix.name }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15, ext: "" }
          - { name: windows-x86_64, runner: windows-2025, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the binary
        shell: bash
        run: ./scripts/build-native.sh

      - name: Name the binary after its platform
        shell: bash
        run: mv "dist/iroha-reader-cli${{ matrix.ext }}" "dist/iroha-reader-cli-${{ matrix.name }}${{ matrix.ext }}"

      # espeak-ng stays off PATH on Windows, as its installer leaves it.
      - uses: ./.github/actions/audio-tools

      - name: Read a document and serve the reading room
        shell: bash
        run: ./scripts/smoke-test.sh "dist/iroha-reader-cli-${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist/iroha-reader-cli-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  nuitka:
    name: x86_64 Nuitka binary
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      UV_PYTHON: /opt/python/cp313-cp313/bin/python3
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # manylinux ships its Pythons without a shared libpython; Nuitka links
      # the static one, which the image keeps packed away for this purpose.
      - name: Unpack the static libpython
        run: cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz

      - name: Build the binary
        run: ./scripts/build-nuitka.sh

      - name: Report the glibc floor
        run: |
          objdump -T dist/iroha-reader-cli-nuitka \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

      - name: Name the binary after its architecture
        run: mv dist/iroha-reader-cli-nuitka dist/iroha-reader-cli-linux-x86_64-nuitka

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-nuitka
          path: dist/iroha-reader-cli-linux-x86_64-nuitka
          if-no-files-found: error

  nuitka-smoke:
    name: x86_64 Nuitka smoke test
    needs: nuitka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries-nuitka
          path: dist

      - uses: ./.github/actions/audio-tools

      - name: Read a document and serve the reading room
        run: |
          chmod +x dist/*
          ./scripts/smoke-test.sh dist/iroha-reader-cli-linux-x86_64-nuitka

  publish:
    needs: [smoke, other-platforms, nuitka-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the wheel and the sdist
        run: uv build --out-dir dist-python

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Notes for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v want="## [$tag]" '
            index($0, want) == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
          ls -l dist dist-python
          cat release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/* dist-python/*)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
