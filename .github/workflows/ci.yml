name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install the audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run the tests
        run: uv run --no-sync pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: ruff
        run: uv run --no-sync ruff check --output-format github .

      - name: mypy
        run: uv run --no-sync mypy

  build:
    name: build the single file binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build
        run: ./scripts/build-native.sh

      - name: It runs and reads a document
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          ./dist/iroha-reader-cli examples/sample_en.txt -o /tmp/out --subs lrc,srt
          test -s /tmp/out/sample_en.mp3
          test -s /tmp/out/sample_en.lrc
          cat /tmp/out/sample_en.lrc
